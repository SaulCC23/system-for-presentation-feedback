<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vista del Espectador</title>
<link rel="stylesheet" href="dashboard_espectadores.css" />
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div class="container">
  <div class="presentacion">
    <h2>PRESENTACIÓN EN VIVO</h2>
    <div class="slide">
      <video id="liveVideo" autoplay playsinline controls></video>
      <div id="no-stream-message" style="color: red; padding: 20px; text-align: center;">Esperando al presentador...</div>
    </div>
  </div>

  <div class="feedback">
    <h3>FEEDBACK EN VIVO</h3>
    <p class="codigo">CÓDIGO DE SESIÓN: <strong id="session-code"></strong></p>
    <button id="copy-code-btn">🔗 Compartir código</button>

    <div class="chat">
      <h4>CHAT</h4>
      <div id="chat-messages"></div>
      <input type="text" id="chat-input" placeholder="Escribe tu comentario..." disabled/>
      <button id="send-btn" disabled>➤</button>
      <div id="chat-warning" style="display:none; color:red;">Necesitas iniciar sesión para comentar.</div>
    </div>
  </div>
</div>

<script>
const socket = io("http://localhost:3001");
const user = JSON.parse(localStorage.getItem("user"));
const sessionCode = new URLSearchParams(window.location.search).get("code");
const chatInput = document.getElementById("chat-input");
const sendBtn = document.getElementById("send-btn");
const chatWarning = document.getElementById("chat-warning");
const chatMessagesEl = document.getElementById("chat-messages");
const videoEl = document.getElementById("liveVideo");
const noStreamMsg = document.getElementById("no-stream-message");

document.getElementById("session-code").textContent = sessionCode || "ERROR";
if (!sessionCode) window.location.href = "index.html";

if (user) {
  chatInput.disabled = false;
  sendBtn.disabled = false;
  chatWarning.style.display = "none";
}

socket.emit("join-session", { 
  codigo: sessionCode, 
  rol: "espectador", 
  nombre: user ? user.nombre_completo : "Anónimo"
}, (response) => {
  if (!response.success) {
    alert(response.message || "Error al unirse");
    window.location.href = "index.html";
  }
});

function addChatMessage(msg){
  const p = document.createElement("p");
  p.innerHTML = `<strong>[${msg.hora}] ${msg.nombre}:</strong> ${msg.mensaje}`;
  chatMessagesEl.appendChild(p);
  chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
}

function sendComment(msg){
  if (!user || !msg.trim()) return;
  socket.emit("nuevo-mensaje", { codigo: sessionCode, nombre: user.nombre_completo, mensaje: msg });
  chatInput.value = "";
}

socket.on("chat-history", messages => {
  chatMessagesEl.innerHTML = "";
  messages.forEach(addChatMessage);
});
socket.on("mensaje-chat", addChatMessage);

sendBtn.addEventListener("click", () => sendComment(chatInput.value));
chatInput.addEventListener("keydown", e => { if(e.key==="Enter") sendComment(chatInput.value); });

socket.on("signal", async ({from, signal}) => {
  let pc;
  if(signal.type==="offer") {
    pc = new RTCPeerConnection();
    pc.ontrack = (e)=>{videoEl.srcObject=e.streams[0]; noStreamMsg.style.display='none';};
    pc.onicecandidate = ({candidate})=>{if(candidate) socket.emit("signal",{codigo:sessionCode,to:from,signal:{type:'candidate',candidate}})};
    await pc.setRemoteDescription(new RTCSessionDescription(signal.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit("signal",{codigo:sessionCode,to:from,signal:{type:'answer',answer:pc.localDescription}});
  } else if(signal.type==="candidate" && pc) { try{await pc.addIceCandidate(signal.candidate);}catch(e){console.error(e);} }
});

document.getElementById("copy-code-btn").addEventListener("click",()=>navigator.clipboard.writeText(sessionCode).then(()=>alert("Código copiado: "+sessionCode)));
window.addEventListener('beforeunload',()=>socket.close());
</script>
</body>
</html>
