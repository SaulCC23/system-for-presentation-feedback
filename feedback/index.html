<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantalla de Inicio</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      width: 100%;
      padding-right: 40px;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="login-container">
    <img src="imagenes/logo.png" alt="Logo" class="logo">

    <div class="forms">
      <!-- Profesores / Alumnos -->
      <div class="form-box">
        <h2>Acceso al Sistema</h2>
        <input id="loginEmail" type="email" placeholder="Correo Institucional | matricula@merida.tecnm.mx" required>

        <div class="password-wrapper">
          <input id="loginPassword" type="password" placeholder="Contraseña" required>
          <span id="toggleLoginPassword" class="toggle-password">ver</span>
        </div>

        <button id="loginBtn" class="btn-grad">INICIAR SESIÓN</button>
        <a href="register.html" class="register-link">Registrarse</a>
        <a href="recuperacion.html" class="register-link">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Invitados -->
      <div class="form-box">
        <h2>Acceso como Invitado</h2>
        <input id="sessionCode" type="text" placeholder="Código de Sesión">
        <button id="anonBtn" class="btn-grad">ENTRAR</button>
        <p class="info">No necesitas cuenta (solo podrás escuchar/ver).</p>
      </div>
    </div>
  </div>

<script>
// Toggle seguro
const toggleLoginPassword = document.getElementById('toggleLoginPassword');
const loginPasswordInput = document.getElementById('loginPassword');

toggleLoginPassword.addEventListener('mousedown', () => {
  loginPasswordInput.setAttribute('type', 'text');
  toggleLoginPassword.textContent = 'ocultar';
});
toggleLoginPassword.addEventListener('mouseup', () => {
  loginPasswordInput.setAttribute('type', 'password');
  toggleLoginPassword.textContent = 'ver';
});
toggleLoginPassword.addEventListener('mouseleave', () => {
  loginPasswordInput.setAttribute('type', 'password');
  toggleLoginPassword.textContent = 'ver';
});
loginPasswordInput.addEventListener('blur', () => {
  loginPasswordInput.setAttribute('type', 'password');
  toggleLoginPassword.textContent = 'ver';
});

// Login normal
document.getElementById('loginBtn').addEventListener('click', async () => {
  const correo = document.getElementById('loginEmail').value.trim();
  const password = loginPasswordInput.value;

  let errores = [];
  if (!correo) errores.push("Ingresa tu correo institucional");
  if (!password) errores.push("Ingresa tu contraseña");
  if (correo && !correo.endsWith("@merida.tecnm.mx")) errores.push("El correo debe ser institucional (@merida.tecnm.mx)");

  if (errores.length > 0) return alert("Error:\n- " + errores.join("\n- "));

  try {
    const res = await fetch('http://localhost:3001/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ correo, password })
    });

    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('user', JSON.stringify(data.user));

      if (data.user.rol === 1) window.location.href = 'dashboard_profesor.html';
      else if (data.user.rol === 2) window.location.href = 'dashboard_alumno.html';
      else alert('Rol no reconocido');
    } else {
      alert('Error: ' + data.message);
    }
  } catch (err) {
    console.error(err);
    alert('Error de conexión con el servidor');
  }
});

// Acceso anónimo con validación del código
document.getElementById('anonBtn').addEventListener('click', async () => {
  const code = document.getElementById('sessionCode').value.trim();
  if (!code) return alert('Ingresa un código de sesión.');

  try {
    const res = await fetch(`http://localhost:3001/api/sessions/${code}/status`);
    const data = await res.json();
    if (!data.isActive) return alert("Código de sesión inválido o expirado.");

    localStorage.removeItem("user"); // invitado
    localStorage.setItem("sessionCode", code);
    window.location.href = `dashboard_espectadores.html?code=${encodeURIComponent(code)}`;
  } catch(err) {
    console.error(err);
    alert("Error de conexión con el servidor");
  }
});
</script>
</body>
</html>
