<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo Profesor</title>
  <link rel="stylesheet" href="dashboard_profesor.css">
  <style>
    .logout-btn {
      background: #000;
      color: #fff;
      padding: 0.8rem 1.2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      margin-top: 2rem;
      transition: opacity 0.3s;
    }
    .logout-btn:hover {
      opacity: 0.8;
    }
    .btn-group .btn {
      margin: 0.5rem;
      padding: 0.8rem 1.2rem;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      font-weight: 600;
    }
    .btn-group .btn:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MODO PROFESOR</h1>

    <div class="session-box">
      <p>CÓDIGO DE SESIÓN:</p>
      <h2><span id="session-code"></span></h2>
    </div>

    <button class="share-btn" id="copy-code">COMPARTIR CÓDIGO</button>

    <hr>

    <div class="controls">
      <h3>CONTROLES DE PRESENTACIÓN</h3>
      <div class="btn-group">
        <button class="btn" id="go-presenter">MODO PRESENTADOR</button>
        <button class="btn" id="start-session">INICIAR NUEVA SESIÓN</button>
        <button class="btn">GENERAR CÓDIGO</button>
      </div>
    </div>

    <button id="logoutBtn" class="logout-btn">CERRAR SESIÓN</button>
  </div>

<script>
  // Validación de usuario
  const user = JSON.parse(localStorage.getItem('user'));

  if (!user || user.rol !== 1) {
    alert("Acceso no autorizado");
    window.location.href = "index.html";
  } else {
    console.log("Bienvenido, profesor:", user.nombre_completo);
  }

  // Códigos de sesión permitidos
  const codigosPermitidos = ["123456", "123457"];
  let currentIndex = 0;

  function setSessionCode() {
    const sessionCode = codigosPermitidos[currentIndex];
    document.getElementById('session-code').textContent = sessionCode;
    localStorage.setItem('sessionCode', sessionCode);
  }

  // Inicializa con el primer código
  setSessionCode();

  // Botón de iniciar nueva sesión: cambia al siguiente código disponible
  document.getElementById('start-session').addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % codigosPermitidos.length;
    setSessionCode();
    alert("Sesión iniciada con código: " + codigosPermitidos[currentIndex]);
  });

  // Copiar código
  document.getElementById('copy-code').addEventListener('click', () => {
    const code = document.getElementById('session-code').textContent;
    navigator.clipboard.writeText(code).then(() => {
      alert("Código copiado: " + code);
    });
  });

  // Redirigir a modo presentador
  document.getElementById('go-presenter').addEventListener('click', () => {
    window.location.href = "dashboard_presentador.html";
  });

  // Cerrar sesión
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('user');
    localStorage.removeItem('sessionCode');
    window.location.href = "index.html";
  });
</script>
</body>
</html>
