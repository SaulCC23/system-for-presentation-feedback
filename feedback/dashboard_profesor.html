<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo Profesor</title>
  <link rel="stylesheet" href="dashboard_profesor.css">
</head>
<body>
  <div class="container">
    <h1>MODO PROFESOR</h1>
    <div class="session-box">
      <p>CÓDIGO DE SESIÓN:</p>
      <h2><span id="session-code">Cargando...</span></h2>
    </div>

    <button class="share-btn" id="copy-code">COMPARTIR CÓDIGO</button>
    <hr>

    <div class="controls">
      <h3>CONTROLES DE PRESENTACIÓN</h3>
      <div class="btn-group">
        <button class="btn" id="go-presenter">MODO PRESENTADOR</button>
        <button class="btn" id="generate-code-btn">GENERAR NUEVO CÓDIGO</button>
      </div>
    </div>

    <button id="logoutBtn" class="logout-btn">CERRAR SESIÓN</button>
  </div>

<script>
const API_URL = "http://localhost:3001/api/sessions";
const user = JSON.parse(localStorage.getItem('user'));
const sessionCodeSpan = document.getElementById('session-code');
const goPresenterBtn = document.getElementById('go-presenter');
const generateCodeBtn = document.getElementById('generate-code-btn');

if (!user || user.rol !== 1) {
  alert("Acceso no autorizado");
  window.location.href = "index.html";
} else initializeSessionCode();

async function generateNewSessionCode() {
  sessionCodeSpan.textContent = "Generando...";
  goPresenterBtn.disabled = true;
  try {
    const res = await fetch(API_URL, { method: 'POST' });
    const data = await res.json();
    const newCode = data.code;
    sessionCodeSpan.textContent = newCode;
    localStorage.setItem('sessionCode', newCode);
    alert(`✅ Nueva sesión creada: ${newCode}`);
  } catch (err) {
    console.error(err);
    sessionCodeSpan.textContent = "ERROR";
    alert("No se pudo generar el código.");
  } finally {
    goPresenterBtn.disabled = false;
  }
}

async function initializeSessionCode() {
  let currentCode = localStorage.getItem('sessionCode');
  if (currentCode) {
    try {
      const statusRes = await fetch(`${API_URL}/${currentCode}/status`);
      const statusData = await statusRes.json();
      if (statusData.isActive) {
        sessionCodeSpan.textContent = currentCode;
        return;
      }
    } catch {}
  }
  await generateNewSessionCode();
}

generateCodeBtn.addEventListener('click', generateNewSessionCode);

document.getElementById('copy-code').addEventListener('click', () => {
  const code = sessionCodeSpan.textContent;
  if (!/^\d{6}$/.test(code)) return;
  navigator.clipboard.writeText(code).then(() => alert("Código copiado: " + code));
});

goPresenterBtn.addEventListener('click', () => {
  const code = sessionCodeSpan.textContent;
  if (!/^\d{6}$/.test(code)) return alert('Código inválido.');
  window.location.href = `dashboard_presentador.html?code=${code}`;
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('user');
  localStorage.removeItem('sessionCode'); 
  window.location.href = "index.html";
});
</script>
</body>
</html>
