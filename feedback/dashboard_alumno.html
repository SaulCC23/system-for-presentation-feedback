<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo Alumno</title>
  <link rel="stylesheet" href="dashboard_profesor.css">
  <style>
    .session-box input {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      margin-top: 0.5rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .btn {
      padding: 0.8rem 1.2rem;
      margin-top: 1rem;
      margin-bottom: 20px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: 600;
    }

    .logout-btn {
      background: #000;
      color: #fff;
      padding: 0.8rem 1.2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      margin-top: 2rem;
      transition: opacity 0.3s;
    }

.session-box{
    inset: 0;
    border-radius: 10px;
    padding: 20px 50px;
}

    .btn:hover {
      opacity: 0.8;
    }

    .centrar{
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MODO ALUMNO</h1>

    <div>
      <p>Introduce el código de sesión del profesor:</p>
      <input type="text" id="sessionCodeInput" class="session-box" placeholder="Ej: 123456" />
    </div>

    <button id="join-btn" class="btn centrar" >UNIRME A LA SESIÓN</button>
    <hr>
    <button id="logout-btn" class="logout-btn centrar">Cerrar Sesión</button>
  </div>

<script>
  const user = JSON.parse(localStorage.getItem('user'));

  // Solo permitir acceso si está logueado y es alumno
  if (!user || user.rol !== 2) {
    alert("Debes iniciar sesión como alumno para acceder a esta página.");
    window.location.href = "index.html";
  }

  const joinBtn = document.getElementById("join-btn");
  const logoutBtn = document.getElementById("logout-btn");

  joinBtn.addEventListener("click", () => {
    const code = document.getElementById("sessionCodeInput").value.trim();
    if (!code) {
      alert("Debes ingresar un código de sesión.");
      return;
    }

    // Validar que el código sea 123456 o 123457
    if (code !== "123456" && code !== "123457") {
      alert("Código de sesión inválido.");
      return;
    }

    // Guardar el código de sesión para la sala de espectadores
    localStorage.setItem("sessionCode", code);

    // Redirigir a la sala de espectadores con el código como query param
    window.location.href = `dashboard_espectadores.html?code=${encodeURIComponent(code)}`;
  });

  logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("user");
    localStorage.removeItem("sessionCode");
    window.location.href = "index.html";
  });
</script>
</body>
</html>
