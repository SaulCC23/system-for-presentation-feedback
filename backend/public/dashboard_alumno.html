<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo Alumno</title>
  <link rel="stylesheet" href="dashboard_profesor.css">
  <style>
    .session-box input { width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 0.5rem; border-radius: 5px; border: 1px solid #ccc; }
    .btn { padding: 0.8rem 1.2rem; margin-top: 1rem; margin-bottom: 20px; cursor: pointer; border: none; border-radius: 8px; font-weight: 600; }
    .logout-btn { background: #000; color: #fff; padding: 0.8rem 1.2rem; border: none; border-radius: 50px; cursor: pointer; font-size: 1rem; font-weight: 600; margin-top: 2rem; transition: opacity 0.3s; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MODO ALUMNO</h1>

    <div>
      <p>Introduce el código de sesión del profesor:</p>
      <input type="text" id="sessionCodeInput" class="session-box" placeholder="Ej: 123456" maxlength="6" />
    </div>

    <button id="join-btn" class="btn centrar" >UNIRME A LA SESIÓN</button>
    <hr>
    <button id="logout-btn" class="logout-btn centrar">Cerrar Sesión</button>
  </div>

<script>
  const API_URL = "http://localhost:3001/api/sessions";
  const user = JSON.parse(localStorage.getItem('user'));

  if (!user || user.rol !== 2) {
    alert("Debes iniciar sesión como alumno para acceder a esta página.");
    window.location.href = "index.html";
  }

  const joinBtn = document.getElementById("join-btn");
  const sessionCodeInput = document.getElementById("sessionCodeInput");


  joinBtn.addEventListener("click", async () => {
    const code = sessionCodeInput.value.trim();

    if (!code || !/^\d{6}$/.test(code)) {
      alert("Debes ingresar un código de sesión válido de 6 dígitos.");
      return;
    }
    
    joinBtn.disabled = true;
    joinBtn.textContent = "Verificando...";

    try {
      const response = await fetch(`${API_URL}/${code}/status`);
      const data = await response.json();

      if (!response.ok || !data.isActive) {
        alert("⚠️ Código de sesión no activo o inválido.");
        return;
      }
      
      // Redirigir si la validación es exitosa
      window.location.href = `dashboard_espectadores.html?code=${encodeURIComponent(code)}`;

    } catch (error) {
      console.error("Error validando el código:", error);
      alert("Ocurrió un error al conectar con el servidor. Intenta de nuevo.");
    } finally {
      joinBtn.disabled = false;
      joinBtn.textContent = "UNIRME A LA SESIÓN";
    }
  });

  document.getElementById("logout-btn").addEventListener("click", () => {
    localStorage.removeItem("user");
    window.location.href = "index.html";
  });
</script>
</body>
</html>
