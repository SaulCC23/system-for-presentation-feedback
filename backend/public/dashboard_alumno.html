<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo Alumno</title>
  <link rel="stylesheet" href="dashboard_alumno.css"> 
  <style>
    /* Estilos para el contenedor de botones inferiores */
    .footer-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
    }

    /* Estilos generales de los botones grandes, ahora en el CSS principal */
    .btn { padding: 0.8rem 1.2rem; margin-top: 1rem; margin-bottom: 20px; cursor: pointer; border: none; border-radius: 8px; font-weight: 600; }
    
    /* Estilo base para los botones de la parte inferior */
    .footer-btn { 
      padding: 0.8rem 1.2rem; 
      border: none; 
      border-radius: 50px; 
      cursor: pointer; 
      font-size: 1rem; 
      font-weight: 600; 
      transition: background-color 0.3s, color 0.3s, transform 0.2s;
      flex: 1; /* Para que ocupen espacio dentro del flexbox */
      margin: 0 5px; /* Pequeño margen entre ellos */
    }

    /* Estilo para el botón de Cerrar Sesión (similar al original) */
    #logout-btn { 
      background:  #000;;
      color: #fff; 
    }
    #logout-btn:hover {
      background: #521a4b; 
      transform: translateY(-2px);
    }
    
    /* Nuevo estilo para el botón de Modificar Contraseña */
    #change-password-btn { 
      background: #007bff; /* Azul para acción positiva */
      color: #fff;
    }
    #change-password-btn:hover {
      background: #0056b3; 
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MODO ALUMNO</h1>

    <div class="session-box">
      <p>Introduce el código de sesión del profesor para unirte:</p>
      <input type="text" id="sessionCodeInput" placeholder="Ej: 123456" maxlength="6" /> 
    </div>

    <button id="join-btn" class="btn">UNIRME A LA SESIÓN</button>
    <hr>
    
    <div class="footer-buttons">
      <button id="change-password-btn" class="footer-btn">Modificar Contraseña</button>
      
      <button id="logout-btn" class="footer-btn">Cerrar Sesión</button>
    </div>
  </div>

<script>
  const API_URL = "http://localhost:3001/api/sessions";
  const user = JSON.parse(localStorage.getItem('user'));

  if (!user || user.rol !== 2) {
    alert("Debes iniciar sesión como alumno para acceder a esta página.");
    window.location.href = "index.html";
  }

  const joinBtn = document.getElementById("join-btn");
  const sessionCodeInput = document.getElementById("sessionCodeInput");
  const logoutBtn = document.getElementById("logout-btn");
  const changePasswordBtn = document.getElementById("change-password-btn");


  joinBtn.addEventListener("click", async () => {
    const code = sessionCodeInput.value.trim();

    if (!code || !/^\d{6}$/.test(code)) {
      alert("Debes ingresar un código de sesión válido de 6 dígitos.");
      return;
    }
    
    joinBtn.disabled = true;
    joinBtn.textContent = "Verificando...";

    try {
      const response = await fetch(`${API_URL}/${code}/status`);
      const data = await response.json();

      if (!response.ok || !data.isActive) {
        alert("⚠️ Código de sesión no activo o inválido.");
        return;
      }
      
      // Redirigir si la validación es exitosa
      window.location.href = `dashboard_espectadores.html?code=${encodeURIComponent(code)}`;

    } catch (error) {
      console.error("Error validando el código:", error);
      alert("Ocurrió un error al conectar con el servidor. Intenta de nuevo.");
    } finally {
      joinBtn.disabled = false;
      joinBtn.textContent = "UNIRME A LA SESIÓN";
    }
  });

  // Evento para el botón de Modificar Contraseña
  changePasswordBtn.addEventListener("click", () => {
    // Redirige a la página para cambiar la contraseña
    window.location.href = "cambiar_contraseña.html";
  });


  // Evento para el botón de Cerrar Sesión
  logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("user");
    window.location.href = "index.html";
  });
</script>
</body>
</html>
